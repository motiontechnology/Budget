<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Presupuesto - Local</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen p-6 font-sans">

    <div class="max-w-[1400px] mx-auto grid grid-cols-1 xl:grid-cols-4 gap-6">
        
        <!-- Panel Izquierdo: Formulario de Registro -->
        <div class="xl:col-span-1 bg-slate-900 border border-slate-800 rounded-xl shadow-[0_0_40px_rgba(37,99,235,0.1)] p-6 h-fit sticky top-6">
            <h2 class="text-xl font-extrabold text-blue-500 mb-4 tracking-wide uppercase">Nueva Transacción</h2>
            
            <form id="presupuestoForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Concepto</label>
                    <select id="nombre" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 focus:border-blue-500 focus:outline-none text-white">
                        <!-- Se llena por JS -->
                    </select>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Estatus</label>
                        <select id="estatus" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-blue-500 focus:outline-none transition-colors">
                            <option value="PENDIENTE">PENDIENTE</option>
                            <option value="PAGADO">PAGADO</option>
                            <option value="AHORRO">AHORRO</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Fecha</label>
                        <input type="date" id="fecha_de_pago" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white [color-scheme:dark] focus:border-blue-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Monto/Mes</label>
                        <input type="number" id="monto_mensual" step="0.01" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Tipo</label>
                        <!-- Se agregó transition-all para el efecto de deshabilitado -->
                        <select id="tipo" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white focus:border-blue-500 focus:outline-none transition-all">
                            <option value="Gasto">Gasto (-)</option>
                            <option value="Ingreso">Ingreso (+)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg mt-4 shadow-lg transition-all">
                    Agregar (Local)
                </button>
            </form>
        </div>

        <!-- Panel Derecho: Tablas -->
        <div class="xl:col-span-3 flex flex-col gap-6">
            
            <!-- TABLA 1: INGRESOS Y EGRESOS PRINCIPALES -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl overflow-hidden">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-extrabold text-white tracking-wide">INGRESOS Y EGRESOS</h2>
                    <div class="text-sm text-slate-400">Balance Activo</div>
                </div>

                <div class="overflow-x-auto rounded-lg border border-slate-700">
                    <table class="w-full text-left border-collapse whitespace-nowrap">
                        <thead>
                            <tr class="bg-slate-950 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                                <th class="px-4 py-3 font-semibold">Estatus</th>
                                <th class="px-4 py-3 font-semibold">Concepto</th>
                                <th class="px-4 py-3 font-semibold">Fecha</th>
                                <th class="px-4 py-3 font-semibold text-right"># Mensual</th>
                                <th class="px-4 py-3 font-semibold text-right">Σ Quincenal</th>
                                <th class="px-4 py-3 font-semibold text-right">Σ Semanal</th>
                                <th class="px-4 py-3 font-semibold text-right">Restante</th>
                                <th class="px-4 py-3 font-semibold text-center">Balance</th>
                                <th class="px-4 py-3 font-semibold text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaBody" class="text-sm divide-y divide-slate-800/50 bg-slate-900">
                            <!-- Renderizado por JS -->
                        </tbody>
                        <tfoot id="tablaFooter" class="bg-slate-950 font-bold border-t border-slate-700 hidden">
                            <tr>
                                <td colspan="3" class="px-4 py-4 text-right text-slate-300 uppercase tracking-widest text-xs">Flujo Neto:</td>
                                <td id="totalMensual" class="px-4 py-4 text-right font-mono text-sm"></td>
                                <td id="totalQuincenal" class="px-4 py-4 text-right font-mono text-sm"></td>
                                <td id="totalSemanal" class="px-4 py-4 text-right font-mono text-sm"></td>
                                <td id="totalRestante" class="px-4 py-4 text-right font-mono text-sm"></td>
                                <td colspan="2"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <!-- TABLA 2: AHORROS -->
            <div class="bg-slate-900 border border-slate-800 border-t-4 border-t-blue-500 rounded-xl p-6 shadow-xl overflow-hidden">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-extrabold text-blue-400 tracking-wide">AHORRO</h2>
                    <div class="text-sm text-slate-400">Total Acumulado</div>
                </div>

                <div class="overflow-x-auto rounded-lg border border-slate-700">
                    <table class="w-full text-left border-collapse whitespace-nowrap">
                        <thead>
                            <tr class="bg-slate-950 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                                <th class="px-4 py-3 font-semibold">Estatus</th>
                                <th class="px-4 py-3 font-semibold">Concepto</th>
                                <th class="px-4 py-3 font-semibold">Fecha</th>
                                <th class="px-4 py-3 font-semibold text-right"># Mensual</th>
                                <th class="px-4 py-3 font-semibold text-right">Σ Quincenal</th>
                                <th class="px-4 py-3 font-semibold text-right">Σ Semanal</th>
                                <th class="px-4 py-3 font-semibold text-right">Restante</th>
                                <th class="px-4 py-3 font-semibold text-center">Balance</th>
                                <th class="px-4 py-3 font-semibold text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaAhorroBody" class="text-sm divide-y divide-slate-800/50 bg-slate-900">
                            <!-- Renderizado por JS -->
                        </tbody>
                        <tfoot id="tablaAhorroFooter" class="bg-slate-950 font-bold border-t border-slate-700 hidden">
                            <tr>
                                <td colspan="3" class="px-4 py-4 text-right text-slate-300 uppercase tracking-widest text-xs">Total Ahorrado:</td>
                                <td id="totalAhMensual" class="px-4 py-4 text-right text-blue-400 font-mono text-sm"></td>
                                <td id="totalAhQuincenal" class="px-4 py-4 text-right text-blue-400 font-mono text-sm"></td>
                                <td id="totalAhSemanal" class="px-4 py-4 text-right text-blue-400 font-mono text-sm"></td>
                                <td id="totalAhRestante" class="px-4 py-4 text-right text-blue-400 font-mono text-sm"></td>
                                <td colspan="2"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

        </div>
    </div>
<script src="app.js"></script>
</body>
</html>
